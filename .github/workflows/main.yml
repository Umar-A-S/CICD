name: Laravel CI CD

on:
  push:
    # trigger saat ada perubahan di branch main dan stagging
    branches:
      - main
      - stagging
    tags:
      - "v*.*.*"
  
  pull_request:
    branches: 
      - main
      - stagging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      packages: write

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.DB }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cp .env.example .env
          rm -f bootstrap/cache/*.php
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=${{ secrets.DB_HOST }}/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=${{ secrets.DB_PORT }}/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=${{ secrets.DB }}/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=${{ secrets.DB_USERNAME }}/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=${{ secrets.DB_PASSWORD }}/' .env

      - name: Build Docker Image
        run: docker build -t selaksa-app:ci .

      - name: Install & Migrate (Testing)
        # menggunakan github secrets
        run: |
          docker run --rm \
            --network host \
            -u root \
            -e APP_KEY=${{ secrets.APP_KEY }} \
            -e DB_CONNECTION=mysql \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=${{ secrets.DB_PORT }} \
            -e DB_DATABASE=${{ secrets.DB }} \
            -e DB_USERNAME=root \
            -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            selaksa-app:ci \
            sh -c "
              composer install &&
              php artisan key:generate &&
              php artisan migrate --force &&
              php artisan test
            "
      # PUSH IMAGE JIKA HANYA DARI MAIN
      - name: Login GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image
        if: github.ref == 'refs/heads/main'
        run: |
          IMAGE_ID=${{ env.REGISTRY }}/$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          docker tag selaksa-app:ci $IMAGE_ID:latest
          docker push $IMAGE_ID:latest

  # otomatisasi delploy ke server dan jalankan deploy.sh di server
  deploy:
    needs: ci
    # hanya jalankan job deploy jika ada tag versi
    if: startsWith(github.ref, 'refs/tags/v') 
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate .env File
        run: |
          cd ${{ secrets.PATH_TUJUAN }}
          
          cat <<EOF > .env

          APP_KEY=${{ secrets.APP_KEY }}
          APP_URL=${{ secrets.APP_URL }}

          DB_CONNECTION=mysql
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_DATABASE=${{ secrets.DB }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD=${{ secrets.DB_PASSWORD }}
          EOF
          
      - name: Generate Nginx Config
        run: |
          target_dir="${{ secrets.PATH_TUJUAN }}"

          sudo rm -rf $target_dir/nginx/default.conf
          mkdir -p $target_dir/nginx

          cat <<'EOF' > $target_dir/nginx/default.conf
          server {
              listen 80;
              server_name /${{ secrets.APP_URL }};

              root /var/www/html/selaksa-app/public;
              index index.php index.html index.htm;

              location / {
                  try_files $uri $uri/ /index.php?$query_string;
              }

              location ~ \.php$ {
                try_files $uri =404;
                fastcgi_split_path_info ^(.+\.php)(/.+)$;
                fastcgi_pass app:9000;
                fastcgi_index index.php;
                include fastcgi_params;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                fastcgi_param PATH_INFO $fastcgi_path_info;
              }

              location ~ /\.ht {
                  deny all;
              }
          }
          EOF
          echo "Nginx config generated at $target_dir/nginx/default.conf"

          sudo chown -R $USER:$USER $target_dir

      - name: Jalankan Script deploy.sh di Lokal
        run: |
          cd ~/${{ secrets.FOLDER }}

          chmod +x deploy.sh
          ./deploy.sh

