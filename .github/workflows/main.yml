name: Laravel CI CD

on:
  push:
    # trigger saat ada perubahan di branch main dan stagging
    branches:
      - main
      - stagging
    tags:
      - "v*.*.*"
  
  pull_request:
    branches: 
      - main
      - stagging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      packages: write

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 313233
          MYSQL_DATABASE: laravel_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cp .env.example .env
          rm -f bootstrap/cache/*.php
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=laravel_test/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=313233/' .env

      - name: Build Docker Image
        run: docker build -t selaksa-app:ci .

      - name: Install & Migrate (Testing)
        run: |
          docker run --rm \
            --network host \
            -u root\
            -e APP_KEY=base64:4ayvStrimUNBc+XMB4tYQMpmzOsDcuiyBTKSOcNjl7I=\
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=3306 \
            -e DB_DATABASE=laravel_test \
            -e DB_USERNAME=root \
            -e DB_PASSWORD=313233 \
            selaksa-app:ci \
            sh -c "
              composer install &&
              php artisan key:generate &&
              php artisan migrate --force &&
              php artisan test
            "
      # PUSH IMAGE JIKA HANYA DARI MAIN
      - name: Login GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image
        if: github.ref == 'refs/heads/main'
        run: |
          IMAGE_ID=${{ env.REGISTRY }}/$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          docker tag selaksa-app:ci $IMAGE_ID:latest
          docker push $IMAGE_ID:latest

  # otomatisasi delploy ke server dan jalankan deploy.sh di server
  deploy:
    needs: ci
    # hanya jalankan job deploy jika ada tag versi
    if: startsWith(github.ref, 'refs/tags/v') 
    runs-on: self-hosted

    steps:
      - name: Jalankan Script deploy.sh di Lokal
        run: |
          # masuk ke folder
          cd ~/prod_selaksa

          # Menjalankan script deploy
          chmod +x deploy.sh
          ./deploy.sh

