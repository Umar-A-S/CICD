name: Laravel CI

on:
  push:
  # Hanya jalankan workflow ini pada cabang 'main' dan 'docker-setupdev'
    branches: [ "main", "docker-setupdev" ]

  pull_request:
  # Hanya jalankan workflow ini pada cabang 'main'
    branches: [ "main" ]

jobs:
  build-and-test:
  # Job untuk membangun dan menguji aplikasi Laravel menggunakan Docker
    runs-on: ubuntu-latest # Menggunakan runner gratis GitHub

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 313233
          MYSQL_DATABASE: laravel_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout Code
        # Mengambil kode sumber dari repository dan menempatkannya di runner
        uses: actions/checkout@v4

      - name: Create .env file for Testing
        # Menyiapkan file .env untuk pengujian
        run: |
          cp .env.example .env  
          # Sesuaikan konfigurasi database untuk MySQL service
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=mysql/g' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=laravel_test/g' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/g' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=313233/g' .env

      - name: Build Docker Image
        # Ini akan mengetes apakah Dockerfile Anda valid dan bisa dibuild
        run: docker build -t selaksa-app:latest .

      - name: Install & Migrate (Testing)
        run: |
          docker run --rm \
            --network host \
            -v $(pwd):/var/www/html/selaksa-app \
            -u root \
            selaksa-app:latest \
            sh -c "composer install && php artisan key:generate && php artisan migrate --force"

      - name: Build Assets
        run: |
          docker run --rm \
            -v $(pwd):/var/www/html/selaksa-app \
            -u root \
            selaksa-app:latest \
            sh -c "npm install && npm run build"

      - name: Success Message
        if: success()
        run: echo "Selamat! CI Anda Berhasil."