name: Laravel CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  laravel-ci:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check PHP version
        run: php -v

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install Composer dependencies
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          mkdir -p database
          touch database/database.sqlite
          php artisan key:generate

      - name: PHP syntax check
        run: |
          find app routes -type f -name "*.php" -print0 \
          | xargs -0 -n1 php -l

      - name: Laravel sanity check
        run: |
          php artisan config:clear
          php artisan route:list > /dev/null
