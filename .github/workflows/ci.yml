name: Laravel CI

on:
  push:
    branches: [ "main", "docker-setupdev" ]
  pull_request:
    branches: [ "main" ]

# Image auto tersimpan di GHCR setelah build sukses
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      packages: write

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: laravel_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cp .env.example .env
          # Membersihkan bootstrap/cache agar tidak ada konfigurasi lama yang tersangkut
          rm -f bootstrap/cache/*.php
          
          # Mengatur kredensial database untuk runner
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=laravel_test/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=${{ secrets.DB_PASSWORD }}/' .env

      - name: Build Docker Image
        run: docker build -t selaksa-app:latest .

      - name: Install & Migrate (Testing)
        run: |
          docker run --rm \
            --network host \
            -v $(pwd):/var/www/html/selaksa-app \
            -u root \
            selaksa-app:latest \
            sh -c "composer install --no-interaction --prefer-dist && \
                   php artisan config:clear && \
                   php artisan key:generate && \
                   php artisan migrate --force"

      - name: Build Frontend Assets
        run: |
          docker run --rm \
            -v $(pwd):/var/www/html/selaksa-app \
            -u root \
            selaksa-app:latest \
            sh -c "npm install && npm run build"

      # steps php artisan test
      - name : Php Artisan Test
        run : |
          docker run --rm \
            --network host \
            -v $(pwd):/var/www/html/selaksa-app \
            -u root \
            selaksa-app:latest \
            php artisan test

      # Login ke GitHub Container Registry
      - name: Log in to GitHub Container Registry
        if: success() # Hanya login jika langkah sebelumnya sukses
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tahap Build dan Push Docker Image ke GHCR
      - name: Build and Push Docker Image
        if: success() # Hanya build & push jika langkah sebelumnya sukses
        run: |
          # Tag image dengan format: ghcr.io/owner/repo:tag (ghcr.io/username/repo-name:SHA COMMIT)
          # Tag Commit SHA bisa digunakan untuk versi unik setiap commit
          IMAGE_ID=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SHA_TAG=${{ github.sha }}

          docker tag selaksa-app:latest $IMAGE_ID:latest
          docker tag selaksa-app:latest $IMAGE_ID:$SHA_TAG

          # Push image ke GHCR 
          docker push $IMAGE_ID:latest
          docker push $IMAGE_ID:$SHA_TAG

      - name: Success Message
        if: success()
        run: echo "Image berhasil di-push ke GHCR: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
      - name: Failure Message
        if: failure()
        run: echo "Proses build atau push image gagal. Periksa log di atas untuk detailnya."