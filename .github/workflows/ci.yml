name: Laravel CI

on:
  push:
    branches: [ "main", "docker-setupdev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: laravel_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cp .env.example .env
          # Membersihkan bootstrap/cache agar tidak ada konfigurasi lama yang tersangkut
          rm -f bootstrap/cache/*.php
          
          # Mengatur kredensial database untuk runner
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=laravel_test/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=rootpassword/' .env

      - name: Build Docker Image
        run: docker build -t selaksa-app:latest .

      - name: Install & Migrate (Testing)
        run: |
          docker run --rm \
            --network host \
            -v $(pwd):/var/www/html/selaksa-app \
            -u root \
            selaksa-app:latest \
            sh -c "composer install --no-interaction --prefer-dist && \
                   php artisan config:clear && \
                   php artisan key:generate && \
                   php artisan migrate --force"

      - name: Build Frontend Assets
        run: |
          docker run --rm \
            -v $(pwd):/var/www/html/selaksa-app \
            -u root \
            selaksa-app:latest \
            sh -c "npm install && npm run build"

      - name: Success Message
        if: success()
        run: echo "CI Build Berhasil! Kode Anda siap di-deploy."