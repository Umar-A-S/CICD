name: Laravel CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  laravel-ci:
    runs-on: self-hosted

    steps:
      # 1. Ambil source code
      - uses: actions/checkout@v4

      # 2. Cek PHP
      - name: Check PHP version
        run: php -v

      # 3. Install dependency
      - name: Install Composer dependencies
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress

      # 4. Setup env untuk CI
      - name: Prepare environment
        run: |
          cp .env.example .env
          mkdir -p database
          touch database/database.sqlite
          php artisan key:generate

      # 5. Basic Laravel sanity check
      - name: Laravel basic check
        run: |
          php artisan config:clear
          php artisan route:list > /dev/null
