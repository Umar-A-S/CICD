<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login SELAKSA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* =========================================
           1. GLOBAL & BACKGROUND
           ========================================= */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            overflow: hidden; /* Mencegah scrollbar muncul */
            height: 100vh;
            
            /* Background: Gradient Hitam Transparan + Gambar */
            background-image: 
                linear-gradient(to right, 
                    rgba(0, 0, 0, 1), 
                    rgb(0, 0, 1), 
                    rgba(0, 0, 0, 0.65), 
                    rgba(0, 0, 0, 0.31), 
                    rgba(0, 0, 0, 0)
                ),
                url('login.jpg');
            background-size: cover;
            background-position: center;
        }

        /* Wrapper utama untuk membagi area (Form vs Gambar) */
        .layout {
            display: flex;
            width: 100%;
        }

        /* =========================================
           2. HEADER / LOGO (KIRI ATAS)
           ========================================= */
        .judul {
            margin-top: 20px;
            margin-left: 50px;
            display: flex;
            align-items: center;
        }

        .judul img {
            width: 35px;
            height: auto;
            margin: 10px;
            display: block;
            /* Filter untuk mengubah warna icon hitam menjadi spesifik */
            filter: brightness(0) saturate(100%) invert(45%) sepia(97%) saturate(267%) hue-rotate(167deg) brightness(92%) contrast(102%);
        }

        .judul h2 {
            margin: auto 10px;
            color: #ffffff;
            font-weight: bold;
            font-size: 20px;
            letter-spacing: 2px;
        }

        /* =========================================
           3. FORM LOGIN STYLE
           ========================================= */
        .container {
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            margin-top: 100px;
            margin-left: 50px;
        }

        /* Tipografi Form */
        .container h1 {
            color: white;
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-left: 15px;
        }

        .container h1 span {
            color: #3b5eaf; /* Titik biru */
        }

        .container p {
            color: #cccccc;
            font-size: 12px;
            margin-left: 15px;
            margin-bottom: 30px;
            font-style: italic;
        }

        /* Input Fields */
        .input {
            margin-bottom: 15px;
            height: 60px;
            overflow: hidden;
            border-radius: 20px;
            padding-top: 5px;
        }

        label {
            color: rgb(255, 255, 255);
            font-weight: bold;
            font-size: 12px;
            padding-left: 15px;
            padding-top: 10px;
            display: block;
        }

        input[type="text"], 
        input[type="password"] {
            padding: 5px;
            margin: 5px 0 10px 10px;
            border: none;
            background-color: transparent;
            color: white;
            width: 90%; /* Disesuaikan agar tidak overflow */
            border-bottom: 2px solid #555555;
        }

        input[type="text"]:focus, 
        input[type="password"]:focus {
            outline: none;
            border-bottom: 2px solid #1A2A4F;
        }

        ::placeholder {
            color: #ccccccda;
            font-size: 10px;
            font-weight: bold;
        }

        /* Tombol Login */
        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #1e66aa;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
            margin-left: 10px;
            transition: background 0.3s;
        }

        input[type="submit"]:hover {
            background-color: #4988c4;
        }

        /* Icon Mata (Show Password) */
        .password-container {
            position: relative;
            width: 100%;
        }

        .toggle-password {
            position: absolute;
            right: 15px; /* Sedikit disesuaikan */
            top: 10px;
            cursor: pointer;
            color: #888;
        }

        .toggle-password:hover {
            color: #ccc;
        }

        /* =========================================
           4. CARD STACK (TUMPUKAN GAMBAR)
           ========================================= */
        .card-stacked {
            position: relative;
            margin-top: 100px; 
            margin-left: 500px; /* Jarak layout dari form */
            width: 250px;
            height: 350px;
        }

        /* Style Dasar Kartu */
        .card-back, .card-mid, .card-front {
            position: absolute;
            width: 230px;
            height: 300px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            background-color: #ffffff;
            
            /* Flexbox untuk tata letak isi kartu */
            display: flex;
            flex-direction: column;
            align-items: center;
            
            transition: transform 0.3s ease; /* Animasi halus */
        }

        /* Posisi & Rotasi Spesifik */
        .card-back {
            top: 0;
            left: 200px;
            z-index: 1;
            transform: rotate(15deg);
        }

        .card-mid {
            top: 10px;
            left: -200px;
            z-index: 2;
            transform: rotate(-15deg);
        }

        .card-front {
            top: 20px;
            left: 0;
            z-index: 3;
            transform: rotate(0deg);
        }

        /* Efek Hover pada Kartu */
        .card-back:hover,
        .card-mid:hover,
        .card-front:hover {
            transform: scale(1.05); /* Membesar sedikit saat disentuh mouse */
            z-index: 10; /* Agar muncul paling depan saat di-hover (opsional) */
            transition: transform 0.5s ease-in-out;
        }

        /* Header Titik-titik (Browser Style) */
        .header-dots {
            display: flex;
            gap: 6px;
            padding: 10px;
            width: 100%;
            background-color: #ffffff;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .red { background-color: #ff5f56; }
        .yellow { background-color: #ffbd2e; }
        .green { background-color: #27c93f; }

        /* Gambar dalam Kartu */
        .card-back img,
        .card-mid img,
        .card-front img {
            flex-grow: 1;           /* Mengisi sisa ruang tinggi */
            width: calc(100% - 2px);/* Lebar dikurangi border 1px kiri kanan */
            margin: 0 auto 1px auto;/* Jarak 1px di bawah */
            object-fit: cover;
            border-radius: 0 0 7px 7px;
        }
    </style>
</head>

<body>

    <div class="judul">
        <img src="team.png" alt="Logo Team">
        <h2>SELAKSA</h2>
    </div>
    
    <div class="layout">
        
        <div class="container">
            <h1>Login <span>.</span></h1>
            <p>Transformasi Layanan dalam Satu Genggaman.</p>

            <form action="/login" method="post">
                <div class="input">
                    <label for="username">USERNAME</label>
                    <input type="text" id="username" name="username" placeholder="username" required>
                </div>

                <div class="input">
                    <label for="password">PASSWORD</label>
                    <div class="password-container">
                        <input type="password" id="password" name="password" placeholder="password" required>
                        <i class="fa-solid fa-eye toggle-password" id="togglePassword" onclick="togglePasswordVisibility()"></i>
                    </div>
                </div>

                <input type="submit" value="Login">
            </form>
        </div>
        
        <div class="card-stacked">
            <div class="card-back">
                <div class="header-dots">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                </div>
                <img src="Kota Lama Semarang, Jawa Tengah.jpeg" alt="Kota Lama">
            </div>

            <div class="card-mid">
                <div class="header-dots">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                </div>
                <img src="5.jpg" alt="Gambar 2">
            </div>

            <div class="card-front">
                <div class="header-dots">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                </div>
                <img src="4.jpeg" alt="Gambar 3">
            </div>
        </div>

    </div>

    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById("password");
            const toggleIcon = document.getElementById("togglePassword");

            if (passwordInput.type === "password") {
                // Ubah menjadi text (terlihat)
                passwordInput.type = "text";
                toggleIcon.classList.remove("fa-eye");
                toggleIcon.classList.add("fa-eye-slash");
            } else {
                // Kembalikan menjadi password (titik-titik)
                passwordInput.type = "password";
                toggleIcon.classList.remove("fa-eye-slash");
                toggleIcon.classList.add("fa-eye");
            }
        }
    </script>

</body>
</html>
