<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login SELAKSA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preload" as="image" href="login.jpg">
    
    <style>
        /* =========================================
           1. GLOBAL & BACKGROUND
           ========================================= */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            overflow-x: hidden;
            
            /* Background: Gradient Hitam Transparan + Gambar */
            background-image: 
                linear-gradient(to right, 
                    rgba(0, 0, 0, 2), 
                    rgba(0, 0, 0, 1), 
                    rgba(0, 0, 0, 0.9), 
                    rgba(0, 0, 0, 0.75), 
                    rgba(0, 0, 0, 0.45),
                    rgba(0, 0, 0, 0)
                ),
                url('login.jpg');
            background-size: cover;
            background-position: top;
            background-repeat: no-repeat;
            background-attachment: fixed;

        }

        /* Wrapper utama untuk membagi area (Form vs Gambar) */
        .layout {
            display: flex;
            width: 100%;
        }

        /* =========================================
           2. HEADER / LOGO (KIRI ATAS)
           ========================================= */
        .judul {
            display: flex;
            align-items: center;
            position: fixed;
            width: 100%;
            z-index: 1000;
            /* 1. Berikan warna latar belakang transparan (wajib) */
            background-color: rgba(0, 0, 0, 0.01); 
            
            /* 2. Berikan efek blur pada elemen di belakangnya */
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px); /* Dukungan untuk Safari */
            border-bottom: 1px solid rgba(63, 63, 63, 0.); /* Opsional: border tipis agar terlihat */
            padding-top: 20px;

        }

        .judul img {
            width: 40px;
            height: auto;
            margin: 10px 0 10px 60px;
            display: block;
            /* Filter untuk mengubah warna icon hitam menjadi spesifik */
            filter: brightness(0) saturate(100%) invert(45%) sepia(97%) saturate(267%) hue-rotate(167deg) brightness(92%) contrast(102%);
        }

        .judul h2 {
            margin: auto 10px;
            color: #ffffff;
            font-weight: bold;
            font-size: 25px;
            letter-spacing: 2px;
        }

        /* =========================================
           3. FORM LOGIN STYLE
           ========================================= */
        .container {
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            margin-top: 170px;
            margin-left: 50px;
        }

        /* Tipografi Form */
        .container h1 {
            color: white;
            font-size: 34px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-left: 15px;
        }

        .container h1 span {
            color: #3b5eaf; /* Titik biru */
        }

        .container p {
            color: #cccccc;
            font-size: 12px;
            margin-left: 15px;
            margin-bottom: 30px;
            font-style: italic;
        }

        /* Input Fields */
        .input {
            margin-bottom: 15px;
            height: 60px;
            overflow: hidden;
            border-radius: 20px;
            padding-top: 5px;
        }

        label {
            color: rgb(255, 255, 255);
            font-weight: bold;
            font-size: 12px;
            padding-left: 15px;
            padding-top: 10px;
            display: block;
            letter-spacing: 1px;
        }

        input[type="text"], 
        input[type="password"] {
            padding: 5px;
            margin: 5px 0 10px 10px;
            border: none;
            background-color: transparent;
            color: white;
            width: 90%; /* Disesuaikan agar tidak overflow */
            border-bottom: 2px solid #1a2642;
            letter-spacing: 1px;
            transition: border-bottom 0.4s ease, background-color 0.3s;
        }

        input[type="text"]:focus, 
        input[type="password"]:focus {
            outline: none;
            border-bottom: 2px solid #1A2A4F;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 3px 3px 0 0;
        }

        ::placeholder {
            color: #ccccccda;
            font-size: 10px;
            font-weight: bold;
        }

        /* Tombol Login */
        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #1e66aa;
            border: solid 1px #0759a5;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
            margin-left: 10px;
            letter-spacing: 1px;
            transition: background 0.3s;
        }

        input[type="submit"]:hover {
            background-color: #4988c4;
        }

        /* Icon Mata (Show Password) */
        .password-container {
            position: relative;
            width: 100%;
        }

        .toggle-password {
            position: absolute;
            right: 15px; /* Sedikit disesuaikan */
            top: 10px;
            cursor: pointer;
            color: #888;
        }

        .toggle-password:hover {
            color: #ccc;
        }

        /* =========================================
           4. CARD STACK (TUMPUKAN GAMBAR)
           ========================================= */
        .card-stacked {
            position: relative;
            margin-top: 140px; 
            margin-left: 450px; /* Jarak layout dari form */
            width: 250px;
            height: 350px;
            flex-shrink: 0;
            perspective: 1000px; /* Untuk efek 3D */
            cursor: pointer;
            /* agar tidak terlihat */
            /* opacity: 0; */

        }

        /* Style Dasar Kartu */
        .card-back, .card-mid, .card-front {
            position: absolute;
            width: 230px;
            height: 300px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            background-color: #ffffff;
            
            /* Flexbox untuk tata letak isi kartu */
            display: flex;
            flex-direction: column;
            align-items: center;
            
            transition: transform 0.3s ease; /* Animasi halus */
        }

        /* Posisi & Rotasi Spesifik */
        .card-back {
            top: 0;
            left: 200px;
            z-index: 1;
            transform: rotate(15deg);
        }

        .card-mid {
            top: 10px;
            left: -200px;
            z-index: 2;
            transform: rotate(-15deg);
        }

        .card-front {
            top: 20px;
            left: 0;
            z-index: 3;
            transform: rotate(0deg);
        }

        /* Efek Hover pada Kartu */
        .card-front:hover {
            transform: scale(1.05); /* Membesar sedikit saat disentuh mouse */
            transition: transform 0.5s ease-in-out;
        }
        .card-back:hover {
            transform: scale(1.05) rotate(15deg);
            transition: transform 0.5s ease-in-out;
        }
        .card-mid:hover {
            transform: scale(1.05) rotate(-15deg);
            transition: transform 0.5s ease-in-out;
        }

        /* Header Titik-titik (Browser Style) */
        .header-dots {
            display: flex;
            gap: 6px;
            padding: 10px;
            width: 100%;
            background-color: #ffffff;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .red { background-color: #ff5f56; }
        .yellow { background-color: #ffbd2e; }
        .green { background-color: #27c93f; }

        /* Gambar dalam Kartu */
        .card-back img,
        .card-mid img,
        .card-front img {
            flex-grow: 1;           /* Mengisi sisa ruang tinggi */
            width: calc(100% - 2px);/* Lebar dikurangi border 1px kiri kanan */
            margin: 0 auto 1px auto;/* Jarak 1px di bawah */
            object-fit: cover;
            border-radius: 0 0 7px 7px;
            image-rendering: optimizeQuality;
        }

        .container, .card-stacked {
            animation: fadeInUp 1s ease-out;
        }
        a {
            color: white;
            margin-left: 50px;
            margin-top: 20px;
            display: inline-block;
        }
        /* =========================================
           5. FOOTER
           ========================================= */
        footer {
            margin-top: 100px; /* Dorong footer ke bawah */
            width: 100%;
            height: 100px; /* Sesuaikan tinggi */
            
            /* 1. Berikan warna latar belakang transparan (wajib) */
            background-color: rgba(0, 0, 0, 0.438); 
            
            /* 2. Berikan efek blur pada elemen di belakangnya */
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(10px); /* Dukungan untuk Safari */
            
            /* Tambahan agar terlihat lebih jelas */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .layout {
                flex-direction: column;
                align-items: center;
            }
            .container {
                margin-left: 0;
                width: 80%;
                margin-top: 120px;
            }
            .card-stacked {
                display: none; /* Sembunyikan tumpukan kartu di layar kecil agar fokus ke login */
            }
            .judul img { margin-left: 20px; }
        }
    </style>
</head>

<body>

    <div class="judul">
        <img src="team.png" alt="Logo Team">
        <h2>SELAKSA</h2>
    </div>
    
    <div class="layout">
        
        <div class="container">
            <h1>Login <span>.</span></h1>
            <p>Transformasi Layanan dalam Satu Genggaman.</p>

            <form action="/login" method="post">
                <div class="input">
                    <label for="username">USERNAME</label>
                    <input type="text" id="username" name="username" placeholder="username" required>
                </div>

                <div class="input">
                    <label for="password">PASSWORD</label>
                    <div class="password-container">
                        <input type="password" id="password" name="password" placeholder="password" required>
                        <i class="fa-solid fa-eye toggle-password" id="togglePassword" onclick="togglePasswordVisibility()"></i>
                    </div>
                </div>

                <input type="submit" value="Login" label="Login Button">
            </form>
        </div>
        
        <div class="card-stacked">
            <div class="card-back">
                <div class="header-dots">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                </div>
                <img src="Kota Lama Semarang, Jawa Tengah.jpeg" alt="Kota Lama" loading="lazy">
            </div>

            <div class="card-mid">
                <div class="header-dots">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                </div>
                <img src="5.jpg" alt="Gambar 2" loading="lazy">
            </div>

            <div class="card-front">
                <div class="header-dots">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                </div>
                <img src="4.jpeg" alt="Gambar 3" loading="lazy"">
            </div>
        </div>

    </div>
    <a href="dashboard-selaksa/index.html">Go to Index.html for test</a>
    <!-- Footer -->
    <footer>
        <div style="text-align: center; color: rgba(255,255,255,0.6); font-size: 12px;">
            <p>&copy; 2024 SELAKSA Team. All Rights Reserved.</p>
            <div style="display: flex; gap: 20px; justify-content: center; margin-top: 10px;">
                <a href="#" style="color: white; opacity: 0.5;"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" style="color: white; opacity: 0.5;"><i class="fa-brands fa-linkedin"></i></a>
                <a href="#" style="color: white; opacity: 0.5;"><i class="fa-solid fa-globe"></i></a>
            </div>
        </div>
    </footer>

    <!-- script js -->
    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById("password");
            const toggleIcon = document.getElementById("togglePassword");

            if (passwordInput.type === "password") {
                // Ubah menjadi text (terlihat)
                passwordInput.type = "text";
                toggleIcon.classList.remove("fa-eye");
                toggleIcon.classList.add("fa-eye-slash");
            } else {
                // Kembalikan menjadi password (titik-titik)
                passwordInput.type = "password";
                toggleIcon.classList.remove("fa-eye-slash");
                toggleIcon.classList.add("fa-eye");
            }
        }
    </script>

</body>
</html>
