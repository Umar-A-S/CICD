<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Selaksa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.336), rgba(255, 255, 255, 0.13)), 
                        url('login.jpg') center/cover fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .form-box {
            width: 420px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
            padding: 50px 40px;
            animation: slideIn 0.6s ease-out;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .form-box h2 {
            margin: 0 0 10px;
            color: #2c3e50;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .form-box p {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 14px;
            font-weight: 500;
        }
        
        .input-box {
            position: relative;
            margin-bottom: 25px;
        }
        
        .input-box input {
            width: 100%;
            padding: 13px 16px;
            font-size: 15px;
            color: #2c3e50;
            border: 2px solid #e8eef5;
            border-radius: 10px;
            outline: none;
            background: rgba(255, 255, 255, 0.7);
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .input-box input::placeholder {
            color: transparent;
        }
        
        .input-box input:focus {
            border-color: #3498db;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 20px rgba(52, 152, 219, 0.15);
        }
        
        .input-box label {
            position: absolute;
            top: 13px;
            left: 16px;
            font-size: 15px;
            color: #95a5a6;
            pointer-events: none;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.7);
            padding: 0 5px;
            font-weight: 500;
        }
        
        .input-box input:focus ~ label,
        .input-box input:valid ~ label {
            top: -8px;
            left: 12px;
            color: #3498db;
            font-size: 12px;
            font-weight: 600;
            background: white;
        }
        
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 14px;
        }
        
        .remember-forgot label {
            color: #555;
            display: flex;
            align-items: center;
            cursor: pointer;
            font-weight: 500;
        }
        
        .remember-forgot input[type="checkbox"] {
            margin-right: 8px;
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: #3498db;
        }
        
        .remember-forgot a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        
        .remember-forgot a:hover {
            color: #2980b9;
        }
        
        .btn {
            width: 100%;
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            border: none;
            padding: 13px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 5px 20px rgba(52, 152, 219, 0.3);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(52, 152, 219, 0.4);
            background: linear-gradient(135deg, #2980b9 0%, #1f618d 100%);
        }
        
        .btn:active {
            transform: translateY(0);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }
        
        .login-register {
            text-align: center;
            margin-top: 25px;
        }
        
        .login-register p {
            color: #555;
            font-size: 14px;
            margin: 0;
            font-weight: 500;
        }
        
        .login-register a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .login-register a:hover {
            color: #2980b9;
            text-decoration: underline;
        }
        
        @media (max-width: 480px) {
            .form-box {
                width: 90%;
                padding: 40px 30px;
            }
            
            .form-box h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Welcome Back</h2>
        <p>Masukkan kredensial Anda untuk melanjutkan</p>
        
        <form>
            <div class="input-box">
        
                <input type="email" required>
                <label>Email</label>
            </div>
            
            <div class="input-box">
                <input type="password" required>
                <label>Password</label>
            </div>
            
            <div class="remember-forgot">
                <label><input type="checkbox"> Ingat saya</label>
                <a href="#">Lupa password?</a>
            </div>
            
            <button type="submit" class="btn">Login</button>
            
            <div class="login-register">
                <p>Belum punya akun? <a href="#" class="register-link">Daftar di sini</a></p>
            </div>
        </form>
    </div>
</body>
</html>
