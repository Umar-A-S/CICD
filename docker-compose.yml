services:

  # ------ CORE APPLICATION ----------
  app-test:
    build: .
    container_name: laravel_app_test
    env_file:
      - .env
    ports:
      - "9000:9000"
      # karena .env dimasukkan ke .dockerignore
    volumes:
      - .:/var/www/html/selaksa-app
      - /var/www/html/selaksa-app/vendor # agar vendor tidak tertimpa
      - /var/www/html/selaksa-app/storage # agar storage tidak tertimpa
      - .env:/var/www/html/selaksa-app/.env
    depends_on:
      - mysql-test

  nginx-test:
    image: nginx:latest
    container_name: nginx-test
    ports:
      - "88:80"
    volumes:
      - .:/var/www/html/selaksa-app
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app-test

  mysql-test:
    image: mariadb:10.6
    container_name: mysql-test
    restart: always
    environment:
      MYSQL_DATABASE: selaksa
      MYSQL_USER: selaksa
      MYSQL_PASSWORD: 313233
      MYSQL_ROOT_PASSWORD: root313233
    volumes:
      - mysql_data_test:/var/lib/mysql

  phpmyadmin-test:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin-test
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: mysql
      PMS_ABSOLUTE_URI: https://192.200.50.51/phpmyadmin/
    depends_on:
      - mysql-test

  # --- Monitoring Tools ---
  dozzle-test:
    image: amir20/dozzle:latest
    container_name: dozzle_1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8888:8080"
    restart: unless-stopped

volumes:
  mysql_data_test:
